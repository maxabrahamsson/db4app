name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

permissions:
  id-token: write # Required for OIDC
  contents: read # Required for checkout

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          # OIDC authentication is automatic with Trusted Publishing
      
      - name: Get package version
        id: package-version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: npm run build
      
      - name: Verify package contents
        run: npm pack --dry-run
      
      - name: Check if version already exists
        id: check-version
        run: |
          VERSION=${{ steps.package-version.outputs.VERSION }}
          if npm view db4app-todo-mcp-server@$VERSION version > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version $VERSION already exists on npm. Skipping publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version $VERSION is new. Will publish."
          fi
      
      - name: Publish to npm
        if: steps.check-version.outputs.exists == 'false'
        run: npm publish --access public --provenance
        # OIDC authentication handled automatically by setup-node action
      
      - name: Create GitHub Release
        if: steps.check-version.outputs.exists == 'false' && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.package-version.outputs.VERSION }}
          name: Release v${{ steps.package-version.outputs.VERSION }}
          body: |
            Automated release from main branch.
            
            **Package version:** ${{ steps.package-version.outputs.VERSION }}
            
            **Install with:**
            ```bash
            npx db4app-todo-mcp-server@${{ steps.package-version.outputs.VERSION }}
            ```
            
            See [README.md](README.md) for full documentation.
          draft: false
          prerelease: false

