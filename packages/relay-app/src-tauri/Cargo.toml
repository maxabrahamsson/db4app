[package]
name = "db4-relay"
version = "0.1.0"
description = "DB4 Self-Hosted Relay Server - Connect desktop apps to your browser Postgres"
authors = ["Max Abrahamsson"]
edition = "2021"

[lib]
name = "db4_relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
